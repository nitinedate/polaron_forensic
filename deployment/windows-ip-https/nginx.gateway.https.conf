server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 122.179.141.248  _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
